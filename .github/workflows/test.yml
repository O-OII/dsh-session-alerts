name: Offline fake regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-tests:
    name: Fake only (${{ matrix.os }}, Node ${{ matrix.node }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Provision the pinned artwork DEVELOPMENT dependency, never a runtime dependency.
      - name: Install artwork development dependency
        run: python -m pip install -r tools/requirements-assets.txt
      # Tests and generation are offline after provisioning; native.py never imports Pillow.
      # A Windows runner is NOT live Windows taskbar coverage. Never invoke native.py here.
      - name: Node fake host, reducer, path and localization tests
        run: npm test
      - name: Real offline package assertions
        run: npm run test:pack
      - name: Python fake Win32 and worker tests
        run: python -B -m unittest discover -s test -p test_*.py -v
      - name: Regenerate original font-free assets offline
        run: python -B tools/generate-assets.py
      - name: Verify deterministic committed assets
        run: git diff --exit-code -- assets/badges
